seed: 1
out_dir: smoke/runs
data: {canonical_dir: smoke/canonical, shard_dir: smoke/shards, rows_per_shard: 5000, near_dup_thresh: 0.5}
sources:
  - type: csv
    market: CN
    freq: 1D
    path: smoke/raw/cn_*.csv
    ts_format: "%Y-%m-%d %H:%M"
    columns: {ts: timestamps, open: open, high: high, low: low, close: close, volume: volume, amount: null}
  - type: csv
    market: HK
    freq: 5min
    path: smoke/raw/hk_*.csv
    ts_format: "%Y-%m-%d %H:%M"
    columns: {ts: timestamps, open: open, high: high, low: low, close: close, volume: volume, amount: null}
  - {type: resample, market: HK, from: 5min, to: [15min, 60min, 1D]}
train: {lookback: 64, predict: 0, clip: 5.0, alpha: 0.5, train_end: "2021-06-30", val_start: "2021-07-01", val_end: "2021-12-31"}
tokenizer: {d_in: 6, d_model: 32, n_heads: 4, ff_dim: 64, n_enc_layers: 1, n_dec_layers: 1, ffn_dropout_p: 0.0, attn_dropout_p: 0.0, resid_dropout_p: 0.0, s1_bits: 4, s2_bits: 4, beta: 0.05, gamma0: 1.0, gamma: 1.1, zeta: 0.05, group_size: 4}
tokenizer_train: {micro_batch: 8, lr: 1.0e-3, total_steps: 5, samples_per_epoch: 64, val_samples: 16, log_every: 1, val_every: 5, save_every: 5}
predictor: {s1_bits: 4, s2_bits: 4, n_layers: 1, d_model: 32, n_heads: 4, ff_dim: 64, ffn_dropout_p: 0.0, attn_dropout_p: 0.0, resid_dropout_p: 0.0, token_dropout_p: 0.0, learn_te: true}
predictor_train: {micro_batch: 8, lr: 1.0e-3, total_steps: 5, samples_per_epoch: 64, val_samples: 16, log_every: 1, val_every: 5, save_every: 5}
