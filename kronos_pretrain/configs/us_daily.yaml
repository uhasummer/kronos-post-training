# US daily: S&P 500 stocks + ~40 CME/ICE/COMEX/NYMEX continuous front-month futures, both via yfinance (free).
# Merge into a multi-market run by appending these `sources:` entries to configs/small.yaml (buckets US_1D and USFUT_1D).
seed: 100
out_dir: runs/us
data: {canonical_dir: data/canonical, shard_dir: data/shards, rows_per_shard: 20000000, near_dup_thresh: 0.5}
sources:
  - {type: yfinance, market: US, freq: 1D, universe: sp500, start: "2000-01-01", adjust: true, batch: 100}
  - type: yfinance
    market: USFUT
    freq: 1D
    start: "2000-01-01"
    adjust: false                          # futures: no split/dividend adjustment; continuous series already rolled by Yahoo
    tickers: [ES=F, NQ=F, YM=F, RTY=F, ZB=F, ZN=F, ZF=F, ZT=F, CL=F, BZ=F, NG=F, RB=F, HO=F, GC=F, SI=F, HG=F, PL=F, PA=F,
              ZC=F, ZS=F, ZW=F, ZM=F, ZL=F, KE=F, ZO=F, ZR=F, LE=F, HE=F, GF=F, KC=F, SB=F, CC=F, CT=F, OJ=F, LBS=F,
              6E=F, 6J=F, 6B=F, 6A=F, 6C=F, 6S=F, DX=F, VX=F]
train: {lookback: 512, predict: 0, clip: 5.0, alpha: 0.5, train_end: "2022-12-31", val_start: "2023-01-01", val_end: "2023-12-31"}
